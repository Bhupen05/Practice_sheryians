<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="main">
        <div class="section">
            <div class="all-reels">
                <div class="reels">
                    <video src="./video/1.mp4" autoplay loop muted alt=""></video>
                    <div class="side">
                        <div class="like">
                            <h4><i class="ri-heart-fill"></i></h4>
                            <h6>500</h6>
                        </div>
                        <div class="comment">
                            <h4><i class="ri-chat-3-line"></i></h4>
                            <h6>500</h6>
                        </div>
                        <div class="shear">
                            <h4><i class="ri-send-ins-line"></i></h4>
                            <h6>500</h6>
                        </div>
                        <div class="menu">
                            <h4><i class="ri-more-2-line"></i></h4>
                        </div>
                    </div>
                    <div class="bottom">
                        <div class="user">
                            <img src="https://i.pinimg.com/1200x/59/13/c9/5913c9c259fe4012c186601d3a9c1e79.jpg" alt="">
                            <h3>Savan Kumari</h3>
                            <button>Follow</button>
                        </div>
                        <h5>Lorem ipsum dolor sit amet.</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
